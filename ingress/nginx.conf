worker_processes auto;
pid /tmp/nginx.pid;
error_log /tmp/nginx/error.log warn;

events {}

http {
    access_log /tmp/nginx/access.log;
    resolver 127.0.0.11 valid=30s ipv6=off;
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    client_max_body_size 100m;
    client_body_temp_path /tmp/nginx/client_body;
    proxy_temp_path /tmp/nginx/proxy;
    fastcgi_temp_path /tmp/nginx/fastcgi;
    uwsgi_temp_path /tmp/nginx/uwsgi;
    scgi_temp_path /tmp/nginx/scgi;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    server {
        listen 3000;
        location / {
            set $backend open-webui:8080;
            proxy_pass http://$backend;
        }
    }

    server {
        listen 4000;
        location = /mcp {
            set $backend web-search-mcp:8000;
            proxy_pass http://$backend;
        }
        location = /register {
            set $backend model-portal:8000;
            proxy_pass http://$backend;
        }
        location = /api/register {
            set $backend model-portal:8000;
            proxy_pass http://$backend;
        }
        location / {
            set $backend litellm:4000;
            proxy_pass http://$backend;
        }
    }

    server {
        listen 8000;
        auth_basic "OpenHands";
        auth_basic_user_file /tmp/openhands.htpasswd;
        location / {
            set $backend openhands:8000;
            proxy_pass http://$backend;
        }
    }
}
