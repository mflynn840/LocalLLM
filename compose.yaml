name: ai

services:
  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-local-dev-change-me}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY:?Set LITELLM_SALT_KEY in .env}
      DATABASE_URL: postgresql://litellm:${LITELLM_DB_PASSWORD:?Set LITELLM_DB_PASSWORD in .env}@litellm-db:5432/litellm
      LLAMA_API_BASE: ${LLAMA_API_BASE:-http://llama-server:8080/v1}
      LLAMA_API_KEY: ${LLAMA_API_KEY:-local-no-auth}
      LOCAL_MODEL_ALIAS: ${LOCAL_MODEL_ALIAS:-${DEFAULT_MODEL:-gemma-4-12b}}
    volumes:
      - ./config/litellm.yaml:/app/config.yaml:ro
      - ./config/openhands_chat.py:/app/openhands_chat.py:ro
    depends_on:
      litellm-db:
        condition: service_healthy
    networks:
      - local
    restart: unless-stopped

  openhands-model-queue:
    image: node:22-alpine
    profiles: ["openhands"]
    command: ["node", "/app/model-queue.mjs"]
    environment:
      OPENHANDS_MODEL_SERVER_URL: ${OPENHANDS_MODEL_SERVER_URL:-http://llama-server:8080}
    volumes:
      - ./services/openhands/model-queue.mjs:/app/model-queue.mjs:ro
    networks:
      - local
    restart: unless-stopped

  agent-orchestrator:
    build: ./services/agent-orchestrator
    profiles: ["openhands"]
    environment:
      OPENHANDS_API_URL: http://openhands:8000/api
      OPENHANDS_API_KEY: ${LOCAL_BACKEND_API_KEY:?Set LOCAL_BACKEND_API_KEY in .env}
      LITELLM_API_URL: http://openhands-llm-gateway:4000/v1
      LITELLM_API_KEY: ${LITELLM_MASTER_KEY:-sk-local-dev-change-me}
      ORCHESTRATOR_MODEL: ${ORCHESTRATOR_MODEL:-local-model}
      WORKSPACE_PATH: ${OPENHANDS_WORKSPACE_PATH:-/projects}
      STATE_DIR: /state
    volumes:
      - ./runtime/orchestration:/state
      - ${WORKSPACE_DIR:-./workspace}:${OPENHANDS_WORKSPACE_PATH:-/projects}:${OPENHANDS_WORKSPACE_MODE:-rw}
    networks: [local]
    depends_on:
      openhands:
        condition: service_started
      openhands-llm-gateway:
        condition: service_started

  litellm-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: litellm
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: ${LITELLM_DB_PASSWORD:?Set LITELLM_DB_PASSWORD in .env}
    volumes:
      - litellm-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm -d litellm"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - local
    restart: unless-stopped

  openhands-llm-gateway:
    image: ghcr.io/berriai/litellm:main-stable
    profiles: ["openhands"]
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-local-dev-change-me}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY:?Set LITELLM_SALT_KEY in .env}
      DATABASE_URL: postgresql://litellm:${LITELLM_DB_PASSWORD:?Set LITELLM_DB_PASSWORD in .env}@litellm-db:5432/litellm
      LLAMA_API_BASE: ${LLAMA_API_BASE:-http://llama-server:8080/v1}
      LLAMA_API_KEY: ${LLAMA_API_KEY:-local-no-auth}
      OPENHANDS_QUEUE_API_BASE: http://openhands-model-queue:8080/v1
      LOCAL_MODEL_ALIAS: ${LOCAL_MODEL_ALIAS:-${DEFAULT_MODEL:-gemma-4-12b}}
    volumes:
      - ./runtime/litellm-router.yaml:/app/config.yaml:ro
      - ./config/openhands_chat.py:/app/openhands_chat.py:ro
    depends_on:
      litellm-db:
        condition: service_healthy
      openhands-model-queue:
        condition: service_started
    networks:
      - local
    restart: unless-stopped

  model-portal:
    build: ./services/model-portal
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?Set LITELLM_MASTER_KEY in .env}
      MODEL_SIGNUP_CODE: ${MODEL_SIGNUP_CODE:?Set MODEL_SIGNUP_CODE in .env}
      BACKEND_PUBLIC_URL: ${BACKEND_PUBLIC_URL:-http://localhost:4000}
      LITELLM_INTERNAL_URL: http://litellm:4000
    networks:
      - local
    depends_on:
      litellm:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    environment:
      OPENAI_API_BASE_URL: http://litellm:4000/v1
      OPENAI_API_KEY: ${LITELLM_MASTER_KEY:-sk-local-dev-change-me}
      VECTOR_DB: qdrant
      QDRANT_URI: http://qdrant:6333
      RAG_EMBEDDING_ENGINE: openai
      RAG_EMBEDDING_MODEL: bge-small-en-v1.5
      RAG_OPENAI_API_BASE_URL: http://embedding-server:8081/v1
      RAG_OPENAI_API_KEY: local-no-auth
      CHUNK_SIZE: "384"
      CHUNK_OVERLAP: "64"
      ENABLE_MEMORIES: "true"
      ENABLE_WEB_SEARCH: ${ENABLE_WEB_SEARCH:-false}
      ENABLE_WEB_SEARCH_CONFIRMATION: "true"
      WEB_SEARCH_ENGINE: searxng
      WEB_SEARCH_RESULT_COUNT: "5"
      SEARXNG_QUERY_URL: http://searxng:8080/search
      WEB_LOADER_ENGINE: external
      EXTERNAL_WEB_LOADER_URL: http://web-loader:8001/load
      EXTERNAL_WEB_LOADER_API_KEY: ${WEB_LOADER_API_KEY:-local-web-loader-change-me}
      ENABLE_TOOL_SERVERS: "true"
      WEBUI_AUTH: "true"
      ENABLE_SIGNUP: "true"
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY:?Set WEBUI_SECRET_KEY in .env}
      WEBUI_ADMIN_EMAIL: ${WEBUI_ADMIN_EMAIL:-owner@localhost}
      WEBUI_ADMIN_PASSWORD: ${WEBUI_ADMIN_PASSWORD:?Set WEBUI_ADMIN_PASSWORD in .env}
      SCARF_NO_ANALYTICS: "true"
      DO_NOT_TRACK: "true"
    volumes:
      - open-webui-data:/app/backend/data
    depends_on:
      litellm:
        condition: service_started
      qdrant:
        condition: service_started
      embedding-server:
        condition: service_started
      memory-mcp:
        condition: service_started
    networks:
      - local
    restart: unless-stopped

  ingress:
    build: ./ingress
    image: local-ai-ingress:latest
    environment:
      BACKEND_BIND_ADDRESS: ${BACKEND_BIND_ADDRESS:-127.0.0.1}
      OPENHANDS_BIND_ADDRESS: ${OPENHANDS_BIND_ADDRESS:-127.0.0.1}
    command: ["/entrypoint.sh"]
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    dns:
      - 127.0.0.1
    ports:
      - "${BACKEND_BIND_ADDRESS:-127.0.0.1}:${OPEN_WEBUI_PORT:-3000}:3000"
      - "${BACKEND_BIND_ADDRESS:-127.0.0.1}:${LITELLM_PORT:-4000}:4000"
      - "${OPENHANDS_BIND_ADDRESS:-127.0.0.1}:${OPENHANDS_PORT:-8000}:8000"
    depends_on:
      - open-webui
      - model-portal
    networks:
      - host-access
      - local
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  openhands:
    build: ./services/openhands
    image: local-ai-openhands:1.43.0
    profiles: ["openhands"]
    user: "10001:10001"
    ports:
      - "127.0.0.1:9010-9012:9010-9012"
    group_add:
      - "${OPENHANDS_WORKSPACE_GID:-1000}"
    cap_drop:
      - ALL
    cap_add:
      - SYS_RESOURCE
      - CHOWN
    security_opt:
      - no-new-privileges:true
    environment:
      HOME: /home/openhands
      PORT: "8000"
      GIT_CONFIG_COUNT: "2"
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: ${OPENHANDS_WORKSPACE_PATH:-/projects}
      GIT_CONFIG_KEY_1: safe.directory
      GIT_CONFIG_VALUE_1: /projects
      OPENHANDS_HOST_HOME: ${OPENHANDS_HOST_HOME:?Set OPENHANDS_HOST_HOME in .env}
      OPENHANDS_WORKSPACE_PATH: ${OPENHANDS_WORKSPACE_PATH:-/projects}
      OPENHANDS_HOST_TERMINAL_ENABLED: ${OPENHANDS_HOST_TERMINAL_ENABLED:-false}
      LLM_MODEL: ${OPENHANDS_DEFAULT_MODEL_ID:-litellm_proxy/local-model}
      LLM_BASE_URL: http://openhands-llm-gateway:4000/v1
      LLM_API_KEY: ${LITELLM_MASTER_KEY:-sk-local-dev-change-me}
      OPENHANDS_MODEL_SERVER_URL: ${OPENHANDS_MODEL_SERVER_URL:-http://llama-server:8080}
      OPENHANDS_MODEL_CATALOG_PATH: /opt/local-models/models.tsv
      OPENHANDS_MODEL_CONTEXT_MAX: ${CONTEXT_SIZE:-8192}
      OPENHANDS_DEFAULT_MODEL_ALIAS: ${OPENHANDS_DEFAULT_MODEL_ALIAS:-gemma-4-12b}
      LOCAL_BACKEND_API_KEY: ${LOCAL_BACKEND_API_KEY:?Set LOCAL_BACKEND_API_KEY in .env}
      SESSION_API_KEY: ${LOCAL_BACKEND_API_KEY:?Set LOCAL_BACKEND_API_KEY in .env}
      AGENT_CANVAS_ALLOW_LAN_SESSION_KEY: "1"
      AGENT_CANVAS_DISABLE_TELEMETRY: "1"
      OPENHANDS_WEB_SEARCH_MCP_ENABLED: ${ENABLE_WEB_SEARCH:-true}
      OPENHANDS_ALLOW_COMMANDS: ${OPENHANDS_ALLOW_COMMANDS:-true}
      OPENHANDS_READ_ONLY_ROOT: ${OPENHANDS_READ_ONLY_ROOT:-false}
      OPENHANDS_REQUIRE_APPROVAL: ${OPENHANDS_REQUIRE_APPROVAL:-false}
      NPM_CONFIG_CACHE: /home/openhands/.npm
      NPM_CONFIG_PREFIX: /home/openhands/.local/npm
      BROWSER_MCP_HOME: /home/openhands/.openhands/browsermcp
      DO_NOT_TRACK: "1"
    volumes:
      - openhands-state:/home/openhands/.openhands
      - ${WORKSPACE_DIR:-./workspace}:/projects:${OPENHANDS_WORKSPACE_MODE:-rw}
      - ${WORKSPACE_DIR:-./workspace}:${OPENHANDS_WORKSPACE_PATH:-/projects}:${OPENHANDS_WORKSPACE_MODE:-rw}
      - ./runtime/openhands-host:/run/openhands-host:ro
      - /dev/null:/projects/.env:ro
      - /dev/null:${OPENHANDS_WORKSPACE_PATH:-/projects}/.env:ro
      - ./runtime/openhands-npm-cache:/home/openhands/.npm
      - ./runtime/openhands-npm-global:/home/openhands/.local/npm
      - ./runtime/mcp-packages.json:/home/openhands/.local/mcp-packages.json:ro
      - ./config/models.tsv:/opt/local-models/models.tsv:ro
      - ./models:/models:ro
    working_dir: /home/openhands
    read_only: ${OPENHANDS_READ_ONLY_ROOT:-false}
    pids_limit: 512
    mem_limit: ${OPENHANDS_MEMORY_LIMIT:-16g}
    cpus: ${OPENHANDS_CPU_LIMIT:-8}
    networks:
      - local
      - openhands-egress
    depends_on:
      openhands-llm-gateway:
        condition: service_started
      memory-mcp:
        condition: service_started
      file-edit-mcp:
        condition: service_started
      repo-context-mcp:
        condition: service_started
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    volumes:
      - qdrant-data:/qdrant/storage
    networks:
      - local
    restart: unless-stopped

  embedding-server:
    image: ghcr.io/ggml-org/llama.cpp:server
    command:
      - -m
      - /models/bge-small-en-v1.5/bge-small-en-v1.5-f16.gguf
      - --alias
      - bge-small-en-v1.5
      - --embedding
      - --pooling
      - mean
      - --ctx-size
      - "512"
      - --parallel
      - "4"
      - --host
      - 0.0.0.0
      - --port
      - "8081"
      - -ngl
      - "0"
    volumes:
      - ./models:/models:ro
    networks:
      - local
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8081/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  memory-mcp:
    build:
      context: ./services/memory-mcp
    environment:
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: openhands_memories
      EMBEDDING_URL: http://embedding-server:8081/v1
      EMBEDDING_MODEL: bge-small-en-v1.5
      EMBEDDING_DIMENSIONS: "384"
      MEMORY_PROJECT: ${WORKSPACE_DIR:-./workspace}
    volumes:
      - ${WORKSPACE_DIR:-./workspace}:/projects:ro
    depends_on:
      - qdrant
      - embedding-server
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - local
    restart: unless-stopped

  repo-context-mcp:
    build: ./services/repo-context-mcp
    profiles: ["openhands"]
    environment:
      ENABLE_WEB_SEARCH: ${ENABLE_WEB_SEARCH:-true}
      WEB_LOADER_API_KEY: ${WEB_LOADER_API_KEY:-}
    volumes:
      - ${WORKSPACE_DIR:-./workspace}:/projects:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - local
    restart: unless-stopped

  file-edit-mcp:
    build:
      context: ./services/file-edit-mcp
    profiles: ["openhands"]
    environment:
      OPENHANDS_WORKSPACE_PATH: ${OPENHANDS_WORKSPACE_PATH:-/projects}
    volumes:
      - ${WORKSPACE_DIR:-./workspace}:/projects:${OPENHANDS_WORKSPACE_MODE:-rw}
      - ${WORKSPACE_DIR:-./workspace}:${OPENHANDS_WORKSPACE_PATH:-/projects}:${OPENHANDS_WORKSPACE_MODE:-rw}
      - /dev/null:/projects/.env:ro
      - /dev/null:${OPENHANDS_WORKSPACE_PATH:-/projects}/.env:ro
    networks:
      - local
    restart: unless-stopped

  searxng:
    image: searxng/searxng:latest
    profiles: ["web-search"]
    environment:
      SEARXNG_BASE_URL: http://searxng:8080/
      SEARXNG_PORT: "8080"
      SEARXNG_BIND_ADDRESS: 0.0.0.0
      SEARXNG_SECRET: ${SEARXNG_SECRET:-local-searxng-change-me}
      SEARXNG_LIMITER: "false"
      SEARXNG_PUBLIC_INSTANCE: "false"
      SEARXNG_IMAGE_PROXY: "false"
    volumes:
      - ./config/searxng/settings.yml:/etc/searxng/settings.yml:ro
      - searxng-cache:/var/cache/searxng
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - local
      - search-egress
    restart: unless-stopped

  web-search-mcp:
    build:
      context: ./services/web-tools
    profiles: ["web-search"]
    command: ["python", "-m", "app.search_mcp"]
    environment:
      SEARXNG_URL: http://searxng:8080/search
    depends_on:
      - searxng
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - local
      - search-egress
    restart: unless-stopped

  web-loader:
    build:
      context: ./services/web-tools
    profiles: ["web-search"]
    command:
      - uvicorn
      - app.web_loader:app
      - --host
      - 0.0.0.0
      - --port
      - "8001"
    environment:
      WEB_LOADER_API_KEY: ${WEB_LOADER_API_KEY:-local-web-loader-change-me}
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - local
      - search-egress
    restart: unless-stopped

  mcp-installer:
    image: node:22-bookworm-slim
    profiles: ["mcp-install"]
    command: ["npm"]
    user: "${OPENHANDS_UID:-10001}:${OPENHANDS_WORKSPACE_GID:-1000}"
    working_dir: /tmp
    environment:
      NPM_CONFIG_CACHE: /mcp-cache
      NPM_CONFIG_PREFIX: /mcp-global
    volumes:
      - ./runtime/openhands-npm-cache:/mcp-cache
      - ./runtime/openhands-npm-global:/mcp-global
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - search-egress

  llama-server:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    profiles: ["cuda"]
    command:
      - --models-dir
      - /models
      - --models-preset
      - /app/llama-router.ini
      - --models-max
      - "1"
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - -ngl
      - ${GPU_LAYERS:-auto}
    environment:
      LLAMA_CACHE: /models/.llama-cache
    volumes:
      - ./models:/models:rw
      - ./runtime/llama-router.ini:/app/llama-router.ini:ro
    networks:
      - local
    gpus: all
    restart: unless-stopped

volumes:
  open-webui-data:
  litellm-db-data:
  openhands-state:
  qdrant-data:
  searxng-cache:

networks:
  local:
    internal: true
  search-egress:
    driver: bridge
  openhands-egress:
    driver: bridge
    internal: ${OPENHANDS_EGRESS_ISOLATED:-false}
  host-access:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"
